<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 Boxes with CSS Variables</title>

  <style>

    :root {
      --box1-color: #ff6b6b;
      --box2-color: #4ecdc4;
      --box3-color: #ffe66d;
      --bg-color: #f8f9fa;
      --text-color: #222;
    }


    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-bottom: 40px;
    }


    .container {
      display: flex;
      gap: 20px;
    }


    .box {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .box1 {
      background-color: var(--box1-color);
    }

    .box2 {
      background-color: var(--box2-color);
    }

    .box3 {
      background-color: var(--box3-color);
    }
  </style>
</head>
<body>
  <h1>3 Boxes using CSS Variables</h1>

  <div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
  </div>
</body>
</html>
